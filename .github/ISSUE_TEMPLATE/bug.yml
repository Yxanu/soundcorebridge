name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: macos
    attributes:
      label: macOS version
  - type: textarea
    id: support_report
    attributes:
      label: Sanitized device support report
      description: Use the app's Copy support report button. Do not paste raw logs, Bluetooth names/addresses, serial numbers or HearID snapshots.
      render: text
