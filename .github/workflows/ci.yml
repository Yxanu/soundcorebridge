name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and self-test
    # macos-14 ships Swift 5.10, and Package.swift declares tools version 6.0.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      # The self-test runs entirely offline: frame codec, stream parser,
      # EQ preset table and device profiles. No headset required.
      - name: Self-test
        run: swift run -c release --skip-build soundcorectl selftest
      - name: Check shell entrypoints
        run: bash -n script/build_and_run.sh make-app.sh
